<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add New Task - Student Task Manager</title>
  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="css/add-task.css">
</head>
<body>

  <div class="app-container">
    <!-- Backdrop for mobile menu overlay -->
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <!-- Navigation Sidebar -->
    <aside class="sidebar" id="sidebar">
      <a href="#" class="brand-logo">
        <div class="logo-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
          </svg>
        </div>
        <div class="brand-title">Student<span>Tasker</span></div>
      </a>

      <nav>
        <ul class="nav-menu">
          <li class="nav-item">
            <a href="index.html" class="nav-link">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="7" rx="1"></rect>
                <rect x="14" y="3" width="7" height="7" rx="1"></rect>
                <rect x="14" y="14" width="7" height="7" rx="1"></rect>
                <rect x="3" y="14" width="7" height="7" rx="1"></rect>
              </svg>
              <span>Dashboard</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="add-task.html" class="nav-link active">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 5v14M5 12h14"></path>
              </svg>
              <span>Add Task</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="my-tasks.html" class="nav-link">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 11l3 3L22 4"></path>
                <path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"></path>
              </svg>
              <span>My Tasks</span>
            </a>
          </li>
        </ul>
      </nav>

      <div class="sidebar-footer">
        <div class="user-card">
          <div class="user-avatar">ST</div>
          <div class="user-info">
            <span class="user-name">Student Portal</span>
            <span class="user-role">Academic Workspace</span>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      <!-- Top Navbar Header -->
      <header class="top-navbar">
        <div class="top-nav-left">
          <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Toggle navigation menu">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>
          <div class="breadcrumb">
            <span>Student Manager</span>
            <span class="breadcrumb-separator">/</span>
            <span class="breadcrumb-current">Add Task</span>
          </div>
        </div>

        <div class="date-badge">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
          <span id="currentDateDisplay">Today</span>
        </div>
      </header>

      <!-- Main Page Wrapper -->
      <div class="content-wrapper">
        <!-- Page Header -->
        <section class="page-header">
          <div class="header-title-wrapper">
            <div class="header-icon">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
              </svg>
            </div>
            <h1 class="page-title">Add New Task</h1>
          </div>
          <p class="page-subtitle">Fill in the assignment details below to schedule and track your academic workload.</p>
        </section>

        <!-- Dynamic Success / Error Alert Container -->
        <div id="alertContainer" class="alert-container"></div>

        <!-- Task Creation Form Card -->
        <div class="form-card">
          <form id="taskForm" class="task-form" novalidate>
            <!-- Task Title -->
            <div class="form-group full-width">
              <label for="taskTitle" class="form-label">
                <span>Task Title <span class="required-star">*</span></span>
              </label>
              <div class="input-wrapper">
                <div class="input-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="16" y1="13" x2="8" y2="13"></line>
                    <line x1="16" y1="17" x2="8" y2="17"></line>
                    <polyline points="10 9 9 9 8 9"></polyline>
                  </svg>
                </div>
                <input 
                  type="text" 
                  id="taskTitle" 
                  name="taskTitle" 
                  class="form-input" 
                  placeholder="e.g. Complete Calculus Assignment Chapter 4" 
                  required
                >
              </div>
            </div>

            <!-- Form Row: Subject & Due Date -->
            <div class="form-row">
              <!-- Subject Name -->
              <div class="form-group">
                <label for="subjectName" class="form-label">
                  <span>Subject Name <span class="required-star">*</span></span>
                </label>
                <div class="input-wrapper">
                  <div class="input-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                      <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                    </svg>
                  </div>
                  <input 
                    type="text" 
                    id="subjectName" 
                    name="subjectName" 
                    class="form-input" 
                    placeholder="e.g. Mathematics, Physics, CS101" 
                    required
                  >
                </div>
              </div>

              <!-- Due Date -->
              <div class="form-group">
                <label for="dueDate" class="form-label">
                  <span>Due Date <span class="required-star">*</span></span>
                </label>
                <div class="input-wrapper">
                  <div class="input-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                      <line x1="16" y1="2" x2="16" y2="6"></line>
                      <line x1="8" y1="2" x2="8" y2="6"></line>
                      <line x1="3" y1="10" x2="21" y2="10"></line>
                    </svg>
                  </div>
                  <input 
                    type="date" 
                    id="dueDate" 
                    name="dueDate" 
                    class="form-input" 
                    required
                  >
                </div>
              </div>
            </div>

            <!-- Priority Selector -->
            <div class="form-group full-width" id="priorityGroup">
              <label class="form-label">
                <span>Priority Level <span class="required-star">*</span></span>
              </label>
              <div class="priority-options">
                <div>
                  <input 
                    type="radio" 
                    id="priorityLow" 
                    name="priority" 
                    value="Low" 
                    class="priority-radio-input"
                  >
                  <label for="priorityLow" class="priority-label" data-priority="Low">
                    <span class="priority-badge-dot"></span>
                    <span>Low</span>
                  </label>
                </div>

                <div>
                  <input 
                    type="radio" 
                    id="priorityMedium" 
                    name="priority" 
                    value="Medium" 
                    class="priority-radio-input" 
                    checked
                  >
                  <label for="priorityMedium" class="priority-label" data-priority="Medium">
                    <span class="priority-badge-dot"></span>
                    <span>Medium</span>
                  </label>
                </div>

                <div>
                  <input 
                    type="radio" 
                    id="priorityHigh" 
                    name="priority" 
                    value="High" 
                    class="priority-radio-input"
                  >
                  <label for="priorityHigh" class="priority-label" data-priority="High">
                    <span class="priority-badge-dot"></span>
                    <span>High</span>
                  </label>
                </div>
              </div>
            </div>

            <!-- Description -->
            <div class="form-group full-width">
              <label for="description" class="form-label">
                <span>Description <span class="required-star">*</span></span>
              </label>
              <textarea 
                id="description" 
                name="description" 
                class="form-textarea" 
                placeholder="Provide detailed instructions, submission requirements, or notes about this task..." 
                required
              ></textarea>
            </div>

            <!-- Form Actions -->
            <div class="form-actions">
              <button type="reset" class="btn btn-secondary" id="resetBtn">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                  <path d="M3 3v5h5"></path>
                </svg>
                <span>Reset Form</span>
              </button>

              <button type="submit" class="btn btn-primary" id="submitBtn">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                  <line x1="12" y1="5" x2="12" y2="19"></line>
                  <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                <span>Create Task</span>
              </button>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>

  <script>
    // Format top navbar date
    document.getElementById('currentDateDisplay').textContent = new Date().toLocaleDateString('en-US', {
      weekday: 'short',
      month: 'short',
      day: 'numeric'
    });
  </script>
  <!-- Form Validation & LocalStorage Script -->
  <script src="js/add-task.js"></script>
</body>
</html>
